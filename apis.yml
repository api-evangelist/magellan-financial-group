description: 'Magellan Financial Group Ltd ("MFG", ASX: MFG) is an Australian financial services group operating across Financial
  Markets, Corporate Finance and Investment Management, with over 550 people and more than $40 billion in assets under management.
  Its investment management business trades as Magellan Investment Partners (global equities, global listed infrastructure,
  Australian equities via Airlie, systematic equities via Vinva, and Barrenjoey Private Capital), and it merged with Barrenjoey
  Capital Partners on 1 July 2026. The board proposed renaming the company Barrenjoey Group Limited (ticker BJY), subject
  to a shareholder vote at the 22 October 2026 AGM. No public developer API is published.'

